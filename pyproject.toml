[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mwvse-trading-panel"
version = "2.5.0"
description = "Algorithmic trading panel, position supervisor, and copy-trader for MarketWatch Virtual Stock Exchange (VSE)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "ghostwwn", email = "nour2009sobhy@gmail.com" }
]
keywords = ["trading", "marketwatch", "vse", "algorithmic-trading", "copy-trading", "tradingview", "rich-tui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "playwright>=1.40.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "typer>=0.9.0"
]

[project.urls]
Homepage = "https://github.com/ghostwwn/mwvse-trading-panel"
Repository = "https://github.com/ghostwwn/mwvse-trading-panel"
Author = "https://github.com/ghostwwn"

[project.scripts]
mwvse = "mwvse_panel.cli:app"

[tool.setuptools.packages.find]
include = ["mwvse_panel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

